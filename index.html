,"background-jobs","hmac"],"qn":8},{"id":"concurrency-model","t":"Concurrency: event loop vs threads","tr":"api","lv":"senior","one":"How a server handles many requests at once. Node uses one thread with an event loop; Java/Go/.NET use many threads or goroutines.","rel":["background-jobs","stateless","web-workers"],"qn":8},{"id":"background-jobs","t":"Background jobs & workers","tr":"api","lv":"mid","one":"Work that should not happen inside the user's request (emails, reports, video processing) goes onto a queue for separate worker processes.","rel":["message-queues","idempotency","retries","outbox"],"qn":8},{"id":"orm","t":"ORMs & query builders","tr":"api","lv":"mid","one":"Libraries that map database rows to objects in your language so you write code instead of SQL strings.","rel":["n-plus-one","sql-injection","migrations","indexes"],"qn":8},{"id":"bff","t":"Backend for frontend (BFF)","tr":"api","lv":"senior","one":"A thin server layer built for one specific frontend, which aggregates and reshapes backend data for exactly what its screens need.","rel":["rest","graphql","api-gateway","sessions-jwt"],"qn":8},{"id":"sql-nosql","t":"SQL vs NoSQL families","tr":"db","lv":"mid","one":"Relational databases store tables with a fixed schema and joins. \"NoSQL\" is a grab-bag: document, key-value, wide-column and graph stores, each optimised for one access pattern.","rel":["indexes","transactions","sharding","cap"],"qn":8},{"id":"indexes","t":"Indexes","tr":"db","lv":"mid","one":"A separate sorted data structure that lets the database find rows without scanning the whole table.","rel":["pagination","orm","n-plus-one"],"qn":8},{"id":"transactions","t":"Transactions & ACID","tr":"db","lv":"mid","one":"A transaction groups several writes so they all happen or none do. ACID names the guarantees.","rel":["isolation","saga","outbox","sql-nosql"],"qn":8},{"id":"isolation","t":"Isolation levels & race conditions","tr":"db","lv":"senior","one":"How much concurrent transactions are shielded from each other. Weaker levels are faster but allow specific anomalies.","rel":["transactions","idempotency"],"qn":8},{"id":"normalization","t":"Normalization & data modeling","tr":"db","lv":"mid","one":"Organising tables so each fact is stored in one place, then denormalizing deliberately where reads need it.","rel":["sql-nosql","migrations","cqrs"],"qn":8},{"id":"migrations","t":"Schema migrations","tr":"db","lv":"mid","one":"Versioned scripts that evolve the database schema step by step, run the same way in every environment.","rel":["api-versioning","deploy-strategies","transactions"],"qn":8},{"id":"replication","t":"Replication & read replicas","tr":"db","lv":"senior","one":"Keeping copies of the database on other machines, for failover and to spread read load.","rel":["sharding","consistency","backups","cap"],"qn":8},{"id":"sharding","t":"Partitioning & sharding","tr":"db","lv":"senior","one":"Splitting one big dataset into pieces. Partitioning splits a table within one database; sharding spreads data across several database servers.","rel":["replication","consistent-hashing","scaling"],"qn":8},{"id":"conn-pool","t":"Connection pooling","tr":"db","lv":"mid","one":"Keeping a set of open database connections and lending them to requests, instead of opening a new one each time.","rel":["tcp-udp","serverless","autoscaling"],"qn":8},{"id":"n-plus-one","t":"The N+1 query problem","tr":"db","lv":"mid","one":"Fetching a list with one query, then running one more query per item. 100 items, 101 queries.","rel":["orm","graphql","indexes","tracing"],"qn":8},{"id":"search","t":"Full-text search engines","tr":"db","lv":"senior","one":"Systems like Elasticsearch, OpenSearch, Meilisearch or Typesense built for relevance-ranked text search, typo tolerance and facets.","rel":["indexes","sql-nosql","event-driven"],"qn":8},{"id":"caching-layers","t":"Where caching happens","tr":"perf","lv":"mid","one":"A request can be answered from a cache at many layers: browser, service worker, CDN, reverse proxy, application memory, Redis, and the database's own buffer cache.","rel":["http-caching","cdn","redis","cache-invalidation"],"qn":8},{"id":"http-caching","t":"HTTP caching headers","tr":"perf","lv":"mid","one":"Headers that tell browsers and CDNs whether and how long they may reuse a response.","rel":["cdn","caching-layers","rendering"],"qn":8},{"id":"redis","t":"Redis","tr":"perf","lv":"mid","one":"An in-memory data store used as a cache, session store, rate-limit counter, job queue backend and pub/sub bus.","rel":["cache-invalidation","rate-limiting","pubsub","background-jobs"],"qn":8},{"id":"cache-invalidation","t":"Cache strategies & invalidation","tr":"perf","lv":"senior","one":"Rules for when data enters the cache, when it leaves, and how to avoid serving stale or stampeding.","rel":["redis","caching-layers","consistency"],"qn":8},{"id":"web-vitals","t":"Core Web Vitals","tr":"perf","lv":"mid","one":"Google's user-centred speed metrics: LCP (loading), INP (responsiveness), CLS (visual stability).","rel":["browser-rendering","rendering","bundling","cdn"],"qn":8},{"id":"profiling","t":"Profiling & finding bottlenecks","tr":"perf","lv":"senior","one":"Measuring where time actually goes before optimising anything.","rel":["tracing","indexes","web-vitals","sli-slo"],"qn":8},{"id":"vm-vs-container","t":"Virtual machines vs containers","tr":"ops","lv":"mid","one":"A VM emulates a whole computer with its own OS kernel. A container is an isolated process that shares the host's kernel.","rel":["docker","kubernetes"],"qn":8},{"id":"docker","t":"Docker: images & containers","tr":"ops","lv":"mid","one":"Docker builds images (a frozen filesystem + startup command) and runs them as containers (live instances of an image).","rel":["vm-vs-container","compose","kubernetes","registry"],"qn":8},{"id":"compose","t":"Docker Compose","tr":"ops","lv":"mid","one":"A YAML file that defines several containers (app, Postgres, Redis) and starts them together with one command.","rel":["docker","kubernetes"],"qn":8},{"id":"registry","t":"Container registries","tr":"ops","lv":"mid","one":"A storage service for container images, versioned by tags and content digests.","rel":["docker","ci","supply-chain"],"qn":8},{"id":"kubernetes","t":"Kubernetes (the big picture)","tr":"ops","lv":"senior","one":"A system that runs containers across a fleet of machines and keeps reality matching what you declared: \"I want 5 copies of this, reachable at this name\".","rel":["k8s-objects","docker","helm","autoscaling","service-mesh","paas"],"qn":8},{"id":"k8s-objects","t":"Pods, Deployments, Services, Ingress","tr":"ops","lv":"senior","one":"The four Kubernetes objects you meet first: where code runs, how many copies, how to find them, and how outside traffic gets in.","rel":["kubernetes","health-checks","deploy-strategies","load-balancer"],"qn":8},{"id":"helm","t":"Helm & Kubernetes config","tr":"ops","lv":"senior","one":"Helm packages Kubernetes YAML into templated, versioned \"charts\" so you can install and configure apps with values instead of copy-pasting manifests.","rel":["kubernetes","iac","cd"],"qn":8},{"id":"service-mesh","t":"Service mesh","tr":"ops","lv":"senior","one":"An infrastructure layer (Istio, Linkerd) that handles service-to-service traffic: mTLS encryption, retries, timeouts, traffic splitting and telemetry, without changing app code.","rel":["microservices","https-tls","retries","tracing"],"qn":8},{"id":"cloud-models","t":"IaaS, PaaS, SaaS, serverless","tr":"cloud","lv":"mid","one":"How much of the stack you rent versus manage yourself, from raw VMs up to finished software.","rel":["serverless","kubernetes","paas","aws-map"],"qn":8},{"id":"paas","t":"Platform choice: PaaS vs containers vs Kubernetes","tr":"cloud","lv":"lead","one":"The decision tech leads actually make: where should this run, given team size, traffic, budget and skills?","rel":["cloud-models","kubernetes","adr","build-vs-buy"],"qn":8},{"id":"aws-map","t":"Cloud building blocks map","tr":"cloud","lv":"mid","one":"The handful of service categories every cloud offers under different names. Learn the category, then map names.","rel":["object-storage","vpc","iam","serverless"],"qn":8},{"id":"object-storage","t":"Object storage (S3)","tr":"cloud","lv":"mid","one":"Cheap, practically unlimited, durable storage for files (\"objects\") addressed by key, accessed over HTTP.","rel":["aws-map","cdn","iam"],"qn":8},{"id":"serverless","t":"Serverless functions","tr":"cloud","lv":"mid","one":"Code that runs on demand per request or event, scales automatically, and costs nothing when idle.","rel":["cloud-models","conn-pool","edge"],"qn":8},{"id":"edge","t":"Edge computing","tr":"cloud","lv":"senior","one":"Running code in CDN locations close to users, not in one central region.","rel":["cdn","serverless","regions"],"qn":8},{"id":"regions","t":"Regions & availability zones","tr":"cloud","lv":"mid","one":"A region is a geographic area (Seoul, Frankfurt). Inside it, availability zones are separate data centres with independent power and networking.","rel":["replication","backups","edge"],"qn":8},{"id":"vpc","t":"VPC & private networking","tr":"cloud","lv":"senior","one":"Your own isolated network inside the cloud, split into public and private subnets with firewall rules.","rel":["iam","least-privilege","aws-map"],"qn":8},{"id":"iac","t":"Infrastructure as Code (Terraform)","tr":"cloud","lv":"senior","one":"Describing servers, networks, DNS and databases in code files, reviewed in PRs and applied by a tool, instead of clicking in a console.","rel":["helm","environments","cd"],"qn":8},{"id":"iam","t":"IAM (identity & access management)","tr":"cloud","lv":"senior","one":"The cloud's permission system: which person or service may perform which action on which resource.","rel":["least-privilege","secrets","vpc"],"qn":8},{"id":"autoscaling","t":"Autoscaling","tr":"cloud","lv":"senior","one":"Automatically adding or removing instances based on load metrics.","rel":["scaling","conn-pool","load-balancer","k8s-objects"],"qn":8},{"id":"branching","t":"Branching: trunk-based vs GitFlow","tr":"cicd","lv":"mid","one":"How a team organises branches. Trunk-based means short-lived branches merged to main daily; GitFlow keeps long-lived develop/release branches.","rel":["ci","feature-flags","code-review"],"qn":8},{"id":"ci","t":"Continuous integration","tr":"cicd","lv":"mid","one":"Every push automatically builds the code and runs checks (types, lint, tests) so problems are caught within minutes.","rel":["cd","testing-pyramid","branching","registry"],"qn":8},{"id":"cd","t":"Continuous delivery & deployment","tr":"cicd","lv":"mid","one":"Delivery: every change that passes CI is releasable at the push of a button. Deployment: it goes to production automatically.","rel":["ci","deploy-strategies","feature-flags","dora"],"qn":8},{"id":"deploy-strategies","t":"Deployment strategies","tr":"cicd","lv":"senior","one":"Ways of replacing the running version with a new one: rolling, blue-green, canary, and their trade-offs.","rel":["cd","migrations","feature-flags","k8s-objects"],"qn":8},{"id":"feature-flags","t":"Feature flags","tr":"cicd","lv":"mid","one":"Runtime switches that turn code paths on or off, per user or percentage, without a deploy.","rel":["branching","deploy-strategies","tech-debt"],"qn":8},{"id":"environments","t":"Environments & config (12-factor)","tr":"cicd","lv":"mid","one":"Running the same code in dev, staging and production, with differences expressed only through configuration.","rel":["secrets","iac","stateless"],"qn":8},{"id":"secrets","t":"Secrets management","tr":"cicd","lv":"senior","one":"Keeping API keys, DB passwords and signing keys out of code and logs, delivering them only to the processes that need them, and rotating them.","rel":["iam","least-privilege","environments","bff"],"qn":8},{"id":"semver","t":"Semantic versioning & dependencies","tr":"cicd","lv":"mid","one":"MAJOR.MINOR.PATCH: breaking changes, new features, bug fixes. Plus lockfiles that pin the exact tree you tested.","rel":["supply-chain","ci","api-versioning"],"qn":8},{"id":"three-pillars","t":"Logs, metrics, traces","tr":"obs","lv":"mid","one":"The three main signals from production: logs (events), metrics (numbers over time), traces (one request's path through the system).","rel":["structured-logging","tracing","sli-slo","alerting"],"qn":8},{"id":"structured-logging","t":"Structured logging","tr":"obs","lv":"mid","one":"Logging key-value data (usually JSON) instead of free text, with a request ID on every line.","rel":["three-pillars","tracing"],"qn":8},{"id":"tracing","t":"Distributed tracing","tr":"obs","lv":"senior","one":"Following one request across every service, queue and database call it touches, as a timeline of nested spans.","rel":["three-pillars","n-plus-one","profiling","microservices"],"qn":8},{"id":"sli-slo","t":"SLIs, SLOs, SLAs & error budgets","tr":"obs","lv":"senior","one":"SLI: a measured signal of user happiness. SLO: the target for it. SLA: a contractual promise with penalties. Error budget: how much failure the SLO allows.","rel":["alerting","three-pillars","incidents"],"qn":8},{"id":"alerting","t":"Alerting & on-call","tr":"obs","lv":"senior","one":"Paging a human only when users are affected and action is needed, based on symptoms rather than causes.","rel":["sli-slo","incidents","health-checks"],"qn":8},{"id":"incidents","t":"Incident response & postmortems","tr":"obs","lv":"lead","one":"A practised way to handle outages (roles, communication, mitigation first) and to learn from them afterwards without blame.","rel":["alerting","sli-slo","deploy-strategies","feature-flags"],"qn":8},{"id":"health-checks","t":"Health checks","tr":"obs","lv":"mid","one":"Endpoints that tell load balancers and orchestrators whether an instance is alive and ready to serve.","rel":["k8s-objects","load-balancer","alerting"],"qn":8},{"id":"backups","t":"Backups, RPO & RTO","tr":"obs","lv":"senior","one":"RPO: how much data you can afford to lose. RTO: how long you can afford to be down. Backups exist to meet both, and only count if restores are tested.","rel":["replication","regions","incidents"],"qn":8},{"id":"authn-authz","t":"Authentication vs authorization","tr":"sec","lv":"mid","one":"Authentication proves who you are. Authorization decides what you are allowed to do.","rel":["sessions-jwt","oauth","least-privilege","rbac"],"qn":8},{"id":"sessions-jwt","t":"Sessions vs JWTs","tr":"sec","lv":"mid","one":"Two ways to remember a logged-in user. Server sessions store state server-side with an ID in a cookie; JWTs are signed tokens carrying the claims themselves.","rel":["authn-authz","csrf","xss","oauth","cookies"],"qn":8},{"id":"cookies","t":"Cookie security attributes","tr":"sec","lv":"mid","one":"Flags that control where cookies are sent and who can read them: HttpOnly, Secure, SameSite, Domain, Path, expiry.","rel":["sessions-jwt","csrf","xss"],"qn":8},{"id":"oauth","t":"OAuth 2.0 & OpenID Connect","tr":"sec","lv":"senior","one":"OAuth 2.0 lets an app get limited access to a user's account elsewhere without their password. OIDC adds a standard login layer on top (\"Sign in with Google\").","rel":["sessions-jwt","authn-authz","iam"],"qn":8},{"id":"passwords","t":"Password storage & hashing","tr":"sec","lv":"mid","one":"Store passwords with a slow, salted, purpose-built hash (Argon2id, bcrypt, scrypt). Never encrypt them, never use plain SHA-256.","rel":["authn-authz","rate-limiting","encryption"],"qn":8},{"id":"xss","t":"XSS (cross-site scripting)","tr":"sec","lv":"mid","one":"An attacker gets their JavaScript to run on your site in other users' browsers, usually by injecting it through content you render.","rel":["csp","cookies","sessions-jwt","csrf"],"qn":8},{"id":"csrf","t":"CSRF (cross-site request forgery)","tr":"sec","lv":"mid","one":"A malicious site makes the user's browser send a request to your site, and the browser attaches the user's cookies automatically.","rel":["cookies","cors","xss","sessions-jwt"],"qn":8},{"id":"sql-injection","t":"Injection (SQL & beyond)","tr":"sec","lv":"mid","one":"Untrusted input gets interpreted as code: SQL, shell commands, LDAP, template expressions.","rel":["orm","xss","ssrf"],"qn":8},{"id":"ssrf","t":"SSRF & the OWASP Top 10","tr":"sec","lv":"senior","one":"SSRF tricks your server into making requests to places the attacker cannot reach directly. The OWASP Top 10 is the industry's list of the most common web risks.","rel":["sql-injection","vpc","authn-authz"],"qn":8},{"id":"csp","t":"Security headers & CSP","tr":"sec","lv":"senior","one":"HTTP response headers that tell browsers to enforce extra protections: which scripts may run, whether the page can be framed, HTTPS only, and so on.","rel":["xss","https-tls","reverse-proxy"],"qn":8},{"id":"encryption","t":"Encryption, hashing, signing","tr":"sec","lv":"mid","one":"Encryption hides data and can be reversed with a key. Hashing is one-way fingerprinting. Signing proves who produced data and that it was not changed.","rel":["https-tls","passwords","webhooks","hmac"],"qn":8},{"id":"hmac","t":"HMAC & signed payloads","tr":"sec","lv":"senior","one":"A signature made with a shared secret that proves a message came from someone who knows the secret and was not modified.","rel":["webhooks","encryption","idempotency"],"qn":8},{"id":"least-privilege","t":"Least privilege & defence in depth","tr":"sec","lv":"senior","one":"Give every user, service and key only the access it needs, and layer several independent defences so one failure is not fatal.","rel":["iam","vpc","secrets","authn-authz"],"qn":8},{"id":"rbac","t":"RBAC, ABAC & row-level security","tr":"sec","lv":"senior","one":"Ways to model permissions: by role, by attributes and rules, and enforced inside the database per row.","rel":["authn-authz","least-privilege"],"qn":8},{"id":"supply-chain","t":"Supply-chain security","tr":"sec","lv":"senior","one":"Risks that come through your dependencies, build tools and CI rather than your own code.","rel":["semver","registry","ci"],"qn":8},{"id":"scaling","t":"Vertical vs horizontal scaling","tr":"sys","lv":"mid","one":"Vertical: a bigger machine. Horizontal: more machines sharing the work.","rel":["stateless","load-balancer","sharding","autoscaling"],"qn":8},{"id":"stateless","t":"Stateless services","tr":"sys","lv":"mid","one":"A server that keeps no user-specific data in its own memory or disk between requests. Any instance can handle any request.","rel":["scaling","load-balancer","redis","environments"],"qn":8},{"id":"cap","t":"CAP theorem","tr":"sys","lv":"senior","one":"When a network partition splits a distributed system, it must choose: stay consistent (refuse some requests) or stay available (answer with possibly stale data).","rel":["consistency","replication","sql-nosql"],"qn":8},{"id":"consistency","t":"Consistency models","tr":"sys","lv":"senior","one":"The spectrum of guarantees about when a write becomes visible to readers: strong, read-your-writes, monotonic, eventual.","rel":["cap","replication","cache-invalidation","cqrs"],"qn":8},{"id":"microservices","t":"Monolith vs microservices","tr":"sys","lv":"senior","one":"A monolith is one deployable application. Microservices split it into independently deployable services that own their own data and talk over the network.","rel":["modular-monolith","api-gateway","saga","tracing","ddd"],"qn":8},{"id":"modular-monolith","t":"Modular monolith","tr":"sys","lv":"senior","one":"One deployable app, internally split into modules with explicit public interfaces and no reaching into each other's internals or tables.","rel":["microservices","ddd","coupling","monorepo"],"qn":8},{"id":"api-gateway","t":"API gateway","tr":"sys","lv":"senior","one":"A single entry point in front of backend services that handles routing, auth, rate limits, API keys and request shaping.","rel":["reverse-proxy","bff","rate-limiting","microservices"],"qn":8},{"id":"message-queues","t":"Message queues","tr":"sys","lv":"senior","one":"A durable buffer where producers drop messages and consumers process them later, at their own pace.","rel":["background-jobs","pubsub","idempotency","outbox","retries"],"qn":8},{"id":"pubsub","t":"Pub/sub & event streaming (Kafka)","tr":"sys","lv":"senior","one":"Publishers emit events to a topic; many independent subscribers each receive them. Streaming platforms like Kafka also keep the events as a replayable log.","rel":["message-queues","event-driven","cqrs","realtime"],"qn":8},{"id":"event-driven","t":"Event-driven architecture","tr":"sys","lv":"senior","one":"Services communicate by announcing facts that happened (\"OrderPlaced\") rather than calling each other with commands.","rel":["pubsub","saga","outbox","cqrs"],"qn":8},{"id":"saga","t":"Sagas & distributed transactions","tr":"sys","lv":"senior","one":"A saga breaks a business transaction spanning several services into local steps, each with a compensating action to undo it if a later step fails.","rel":["transactions","outbox","event-driven","idempotency","workflows"],"qn":8},{"id":"outbox","t":"Transactional outbox","tr":"sys","lv":"senior","one":"Write the event into an outbox table in the same DB transaction as the data change; a separate process publishes outbox rows to the queue.","rel":["transactions","message-queues","idempotency","saga"],"qn":8},{"id":"cqrs","t":"CQRS & event sourcing","tr":"sys","lv":"senior","one":"CQRS separates the write model from read models. Event sourcing stores every change as an event and derives current state by replaying them.","rel":["event-driven","pubsub","normalization","consistency"],"qn":8},{"id":"retries","t":"Timeouts, retries, backoff, circuit breakers","tr":"sys","lv":"senior","one":"Every network call needs a timeout; retries need exponential backoff with jitter; circuit breakers stop hammering a dependency that is down.","rel":["idempotency","message-queues","service-mesh","graceful-degradation"],"qn":8},{"id":"graceful-degradation","t":"Graceful degradation & backpressure","tr":"sys","lv":"senior","one":"When parts fail or load exceeds capacity, keep the core working with reduced features, and push back on callers instead of collapsing.","rel":["retries","rate-limiting","message-queues"],"qn":8},{"id":"consistent-hashing","t":"Consistent hashing","tr":"sys","lv":"senior","one":"A way to assign keys to servers so that adding or removing a server only moves a small fraction of keys.","rel":["sharding","redis","cache-invalidation"],"qn":8},{"id":"estimation","t":"Back-of-the-envelope estimation","tr":"sys","lv":"senior","one":"Quick order-of-magnitude math on traffic, storage and bandwidth to check whether a design is plausible.","rel":["scaling","profiling","design-doc"],"qn":8},{"id":"workflows","t":"Durable workflows & schedulers","tr":"sys","lv":"senior","one":"Engines (Temporal, AWS Step Functions, Inngest, Vercel Workflow) that run multi-step processes reliably, persisting progress so they survive crashes and can wait for days.","rel":["saga","background-jobs","message-queues"],"qn":8},{"id":"rendering","t":"Rendering strategies: CSR, SSR, SSG, ISR, streaming","tr":"fe","lv":"senior","one":"Where and when HTML is produced: in the browser, on the server per request, at build time, or at build time with periodic refresh.","rel":["hydration","rsc","http-caching","web-vitals","cdn"],"qn":8},{"id":"hydration","t":"Hydration & islands","tr":"fe","lv":"senior","one":"Hydration is the client re-running components over server-rendered HTML to attach event handlers and state. Islands hydrate only the interactive parts.","rel":["rendering","rsc","web-vitals"],"qn":8},{"id":"rsc","t":"React Server Components","tr":"fe","lv":"senior","one":"Components that run only on the server (or at build), can read data directly, and send rendered output with zero component JS to the browser.","rel":["rendering","hydration","bundling","authn-authz"],"qn":8},{"id":"state-mgmt","t":"State management: server vs client state","tr":"fe","lv":"senior","one":"Separate data owned by the server (cached copies of backend data) from data owned by the UI (open modals, form drafts, selected tab). Different tools fit each.","rel":["rendering","consistency","cache-invalidation"],"qn":8},{"id":"bundling","t":"Bundling, code splitting, tree shaking","tr":"fe","lv":"mid","one":"How source modules become the files the browser downloads, and how to make them smaller and loaded only when needed.","rel":["web-vitals","http-versions","rsc","monorepo"],"qn":8},{"id":"browser-rendering","t":"How the browser renders a page","tr":"fe","lv":"mid","one":"HTML → DOM, CSS → CSSOM, combined into a render tree, then layout (geometry), paint (pixels) and composite (layers to screen).","rel":["web-vitals","web-workers","bundling"],"qn":8},{"id":"web-workers","t":"Web Workers & service workers","tr":"fe","lv":"senior","one":"Web Workers run JS on a background thread. Service workers are a programmable proxy between your page and the network, enabling offline support and caching.","rel":["browser-rendering","concurrency-model","web-vitals"],"qn":8},{"id":"micro-frontends","t":"Micro-frontends","tr":"fe","lv":"lead","one":"Splitting one web app into independently built and deployed frontend pieces owned by different teams, composed at runtime or at the edge.","rel":["microservices","monorepo","design-systems"],"qn":8},{"id":"monorepo","t":"Monorepos","tr":"fe","lv":"senior","one":"Many apps and packages in one repository, with tooling that builds and tests only what a change affects.","rel":["modular-monolith","ci","design-systems","micro-frontends"],"qn":8},{"id":"design-systems","t":"Design systems","tr":"fe","lv":"senior","one":"A shared set of design tokens, components, patterns and guidelines that keeps a product consistent and fast to build.","rel":["a11y","monorepo","micro-frontends"],"qn":8},{"id":"a11y","t":"Accessibility (a11y)","tr":"fe","lv":"mid","one":"Building interfaces usable by people with visual, motor, hearing and cognitive differences, guided by WCAG.","rel":["design-systems","web-vitals"],"qn":8},{"id":"coupling","t":"Coupling & cohesion","tr":"arch","lv":"mid","one":"Cohesion: things that change together live together. Coupling: how much one module must know about another. Aim for high cohesion, low coupling.","rel":["solid","modular-monolith","clean-arch","ddd"],"qn":8},{"id":"solid","t":"SOLID principles","tr":"arch","lv":"mid","one":"Five object-oriented design guidelines about responsibilities and dependencies. Useful as vocabulary; apply with judgement.","rel":["coupling","di","design-patterns","clean-arch"],"qn":8},{"id":"di","t":"Dependency injection","tr":"arch","lv":"mid","one":"Passing a component the things it depends on, rather than letting it create or import them itself.","rel":["solid","test-doubles","clean-arch"],"qn":8},{"id":"design-patterns","t":"Design patterns that matter","tr":"arch","lv":"mid","one":"Named, reusable solutions to recurring design problems. A handful show up constantly in full-stack work.","rel":["solid","di","clean-arch"],"qn":8},{"id":"clean-arch","t":"Layered, hexagonal & clean architecture","tr":"arch","lv":"senior","one":"Ways to keep business logic independent of frameworks, databases and delivery mechanisms by making dependencies point inward.","rel":["coupling","di","ddd","testing-pyramid"],"qn":8},{"id":"ddd","t":"Domain-driven design","tr":"arch","lv":"senior","one":"Modelling software around the business domain, using the business's own language, and splitting large systems along bounded contexts.","rel":["microservices","modular-monolith","clean-arch","event-driven"],"qn":8},{"id":"tech-debt","t":"Technical debt","tr":"arch","lv":"senior","one":"The future cost of shortcuts and outdated design. Sometimes taken on deliberately, like a loan, and paid back with interest.","rel":["refactoring","feature-flags","prioritization","adr"],"qn":8},{"id":"refactoring","t":"Refactoring & legacy code","tr":"arch","lv":"senior","one":"Changing code structure without changing behaviour, in small verified steps; and strategies for safely changing code you do not understand.","rel":["tech-debt","testing-pyramid","feature-flags","code-review"],"qn":8},{"id":"testing-pyramid","t":"Testing strategy: the pyramid & trophy","tr":"arch","lv":"mid","one":"Mix test types by cost and confidence: many fast unit tests, a solid layer of integration tests, and a few end-to-end tests of critical flows.","rel":["test-doubles","contract-testing","ci","refactoring"],"qn":8},{"id":"test-doubles","t":"Mocks, stubs & fakes","tr":"arch","lv":"mid","one":"Stand-ins for real dependencies in tests. Each type suits a different job, and over-mocking produces tests that prove nothing.","rel":["testing-pyramid","di","contract-testing"],"qn":8},{"id":"contract-testing","t":"Contract testing","tr":"arch","lv":"senior","one":"Verifying that a provider API and its consumers agree on request and response shapes, without running everything together end to end.","rel":["api-versioning","testing-pyramid","microservices"],"qn":8},{"id":"adr","t":"Architecture Decision Records","tr":"lead","lv":"lead","one":"Short documents recording one significant decision: context, options, the choice, and its consequences.","rel":["design-doc","build-vs-buy","paas"],"qn":8},{"id":"design-doc","t":"Design docs & RFCs","tr":"lead","lv":"lead","one":"A written proposal for a significant piece of work, circulated for feedback before building.","rel":["adr","estimation","estimation-delivery","stakeholders"],"qn":8},{"id":"code-review","t":"Code review as a lead","tr":"lead","lv":"lead","one":"Reviewing for correctness, design and knowledge-sharing, while keeping reviews fast and kind enough that the team keeps shipping.","rel":["mentoring","ci","branching"],"qn":8},{"id":"estimation-delivery","t":"Estimation & delivery planning","tr":"lead","lv":"lead","one":"Giving useful forecasts under uncertainty, slicing work into small deliverable pieces, and surfacing risk early.","rel":["design-doc","prioritization","stakeholders"],"qn":8},{"id":"dora","t":"DORA metrics","tr":"lead","lv":"lead","one":"Research-backed measures of software delivery performance from Google's DORA program. The classic four keys are deployment frequency, change lead time, change fail rate and recovery time; since 2024 DORA uses five, adding deployment rework rate.","rel":["cd","incidents","branching"],"qn":8},{"id":"build-vs-buy","t":"Build vs buy","tr":"lead","lv":"lead","one":"Deciding whether to build a capability in-house, buy a SaaS, or adopt open source, based on total cost and strategic value.","rel":["adr","paas","design-patterns"],"qn":8},{"id":"mentoring","t":"Mentoring & delegation","tr":"lead","lv":"lead","one":"Growing other engineers and handing over meaningful work, so the team's output does not depend on you.","rel":["code-review","stakeholders","prioritization"],"qn":8},{"id":"prioritization","t":"Prioritisation & saying no","tr":"lead","lv":"lead","one":"Choosing the work with the best value for its cost and risk, and explicitly declining or deferring the rest.","rel":["tech-debt","estimation-delivery","stakeholders"],"qn":8},{"id":"stakeholders","t":"Communicating with non-engineers","tr":"lead","lv":"lead","one":"Translating technical reality into business terms (time, money, risk, customers) and back.","rel":["prioritization","estimation-delivery","incidents","tech-debt"],"qn":8},{"id":"ownership","t":"Ownership & operating as a senior","tr":"lead","lv":"senior","one":"Owning outcomes end to end: understanding why, shipping, measuring, operating, and following up, without being told each step.","rel":["mentoring","design-doc","incidents"],"qn":8},{"id":"js-event-loop","t":"The JavaScript event loop","tr":"jsts","lv":"mid","one":"One thread runs your JS. Work queued for later waits in task queues; the event loop picks it up when the call stack is empty, running all microtasks before the next task.","rel":["concurrency-model","browser-rendering","web-workers","promises"],"qn":8},{"id":"promises","t":"Promises, async/await & error handling","tr":"jsts","lv":"mid","one":"A promise is a placeholder for a future value that settles once: fulfilled or rejected. async/await is syntax on top of it. Most async bugs are about unhandled rejections and accidental sequencing.","rel":["js-event-loop","retries","concurrency-model"],"qn":8},{"id":"closures-scope","t":"Scope, closures & this","tr":"jsts","lv":"mid","one":"Functions remember the variables from where they were created (closures). <code>this</code> is decided by how a function is called, except arrow functions, which take it from where they were defined.","rel":["js-event-loop","memory-gc","state-mgmt"],"qn":8},{"id":"js-modules","t":"Modules: ESM vs CommonJS","tr":"jsts","lv":"mid","one":"Two module systems coexist in JavaScript. ES modules (<code>import</code>/<code>export</code>) are the standard and are statically analysable; CommonJS (<code>require</code>) is Node's older dynamic system.","rel":["bundling","semver","ts-types"],"qn":8},{"id":"memory-gc","t":"Memory, garbage collection & leaks","tr":"jsts","lv":"senior","one":"JS frees memory automatically once nothing can reach an object. Leaks happen when something long-lived keeps a reference you forgot about.","rel":["closures-scope","profiling","k8s-objects"],"qn":8},{"id":"js-engine","t":"How JS engines run your code","tr":"jsts","lv":"senior","one":"Engines like V8 parse your code, start running it in an interpreter, then compile hot functions into optimised machine code based on the types they observe.","rel":["bundling","web-vitals","profiling"],"qn":8},{"id":"ts-types","t":"TypeScript's type system","tr":"jsts","lv":"mid","one":"TypeScript adds static types that are checked at build time and erased at runtime. Its types are structural: shape matters, not names.","rel":["ts-advanced","runtime-validation","contract-testing"],"qn":8},{"id":"ts-advanced","t":"Advanced TypeScript: generics & type-level code","tr":"jsts","lv":"senior","one":"Generics let functions and components work over many types while keeping them connected. Conditional, mapped and template-literal types compute new types from existing ones.","rel":["ts-types","runtime-validation","design-systems"],"qn":8},{"id":"runtime-validation","t":"Runtime validation at boundaries","tr":"jsts","lv":"mid","one":"Parse untrusted data (requests, API responses, env vars, localStorage, LLM output) with a schema at the edge of your system, and get typed data or a clear error.","rel":["ts-types","environments","sql-injection","llm-structured"],"qn":8},{"id":"shell","t":"Shell basics: pipes, redirection, exit codes","tr":"linux","lv":"mid","one":"The shell runs programs and wires them together. Small tools chained with pipes answer questions about logs and files in seconds.","rel":["processes","net-debug","ci"],"qn":8},{"id":"processes","t":"Processes & signals (graceful shutdown)","tr":"linux","lv":"mid","one":"Every running program is a process with an ID. Signals like SIGTERM and SIGKILL ask it to stop, and handling SIGTERM properly is what makes deploys lose zero requests.","rel":["docker","health-checks","deploy-strategies","background-jobs"],"qn":8},{"id":"permissions","t":"Users, files & permissions","tr":"linux","lv":"mid","one":"Linux decides access by user, group and permission bits on each file. Running everything as root is the fastest way to turn a bug into a breach.","rel":["least-privilege","docker","ssh"],"qn":8},{"id":"ssh","t":"SSH & remote servers","tr":"linux","lv":"mid","one":"SSH gives you an encrypted shell on a remote machine, authenticated with key pairs. It also tunnels ports and copies files.","rel":["vpc","permissions","least-privilege"],"qn":8},{"id":"services-systemd","t":"Services, logs & scheduled jobs on a server","tr":"linux","lv":"mid","one":"On a plain Linux server, systemd starts your app at boot, restarts it if it crashes, and collects its logs; cron or systemd timers run scheduled jobs.","rel":["processes","three-pillars","paas"],"qn":8},{"id":"net-debug","t":"Network debugging from the terminal","tr":"linux","lv":"mid","one":"A handful of commands answer \"is it DNS, the network, the port, TLS, or the app?\" in a minute.","rel":["dns","tcp-udp","https-tls","shell"],"qn":8},{"id":"resources-os","t":"CPU, memory & disk on a server","tr":"linux","lv":"mid","one":"Reading load, memory and disk usage tells you whether a slow or crashing server is starved of CPU, memory, disk space or I/O.","rel":["profiling","k8s-objects","memory-gc","three-pillars"],"qn":8},{"id":"llm-basics","t":"How LLMs work (for builders)","tr":"llm","lv":"mid","one":"A large language model predicts the next token over and over, given everything in its context window. Tokens, context length, sampling and statelessness explain most of its behaviour in your app.","rel":["llm-prompting","llm-cost","rag","llm-security"],"qn":8},{"id":"llm-prompting","t":"Prompting as engineering","tr":"llm","lv":"mid","one":"Prompts are code: versioned, tested against examples, and structured with clear instructions, context, examples and an output format.","rel":["llm-basics","llm-evals","llm-structured"],"qn":8},{"id":"llm-structured","t":"Structured output & parsing","tr":"llm","lv":"mid","one":"When code consumes model output, ask for JSON matching a schema, use the provider's structured-output or tool features where available, and always validate before use.","rel":["runtime-validation","tool-calling","llm-security"],"qn":8},{"id":"embeddings","t":"Embeddings & vector search","tr":"llm","lv":"senior","one":"An embedding turns text (or images) into a vector of numbers where similar meanings are close together. Vector search finds the nearest ones.","rel":["rag","search","indexes"],"qn":8},{"id":"rag","t":"Retrieval-augmented generation (RAG)","tr":"llm","lv":"senior","one":"Fetch the relevant pieces of your own data at question time, put them in the prompt, and have the model answer from them, ideally with citations.","rel":["embeddings","search","llm-evals","rbac","llm-prompting"],"qn":8},{"id":"tool-calling","t":"Tool calling (function calling)","tr":"llm","lv":"senior","one":"You describe functions to the model; it replies with a request to call one with arguments; your code runs it and returns the result; the model continues.","rel":["agents","llm-security","llm-structured","mcp"],"qn":8},{"id":"agents","t":"Agents & agentic workflows","tr":"llm","lv":"senior","one":"An agent is an LLM running tools in a loop toward a goal, deciding its own next step. Many problems are better served by fixed workflows with LLM steps.","rel":["tool-calling","workflows","llm-evals","llm-cost"],"qn":8},{"id":"llm-evals","t":"Evals: testing LLM features","tr":"llm","lv":"senior","one":"A fixed set of test inputs with checks, run on every prompt or model change, so you know whether a change made things better or worse.","rel":["testing-pyramid","llm-prompting","rag","ci"],"qn":8},{"id":"llm-security","t":"LLM security: prompt injection & key safety","tr":"llm","lv":"senior","one":"Treat everything the model reads as potentially hostile instructions, everything it outputs as untrusted data, and API keys as money.","rel":["tool-calling","secrets","xss","rate-limiting","ssrf"],"qn":8},{"id":"llm-cost","t":"Cost, latency & reliability of LLM calls","tr":"llm","lv":"senior","one":"LLM calls are slow, metered and sometimes fail. Streaming, caching, model routing, output caps and fallbacks make features feel fast and stay affordable.","rel":["llm-basics","retries","rate-limiting","graceful-degradation"],"qn":8},{"id":"mcp","t":"Model Context Protocol (MCP)","tr":"llm","lv":"senior","one":"An open protocol for exposing tools, resources and prompts to AI applications in a standard way, so one integration works across many AI clients.","rel":["tool-calling","oauth","supply-chain","llm-security"],"qn":8},{"id":"levels","t":"What mid, senior and lead actually mean","tr":"interview","lv":"mid","one":"Levels differ less in what you know than in the size and ambiguity of problems you can own, and how much you multiply others.","rel":["ownership","mentoring","project-story","sysdesign-interview"],"qn":8},{"id":"coding-interview","t":"Coding interviews & coding tests","tr":"interview","lv":"mid","one":"Timed algorithm problems still gate many companies, including most large Korean employers' 코딩테스트. They are learnable by pattern, not by memorising problems.","rel":["sysdesign-interview","levels","behavioral"],"qn":8},{"id":"sysdesign-interview","t":"System design interviews","tr":"interview","lv":"senior","one":"A 45–60 minute conversation where you design a system (a URL shortener, a chat app, a feed) and are judged on structure, trade-offs and depth, not one right answer.","rel":["estimation","scaling","caching-layers","message-queues","levels"],"qn":8},{"id":"behavioral","t":"Behavioral interviews","tr":"interview","lv":"mid","one":"Questions like \"tell me about a conflict\" or \"a project that failed\" test how you work. Prepared, specific stories with your actions and results win.","rel":["project-story","levels","stakeholders"],"qn":8},{"id":"project-story","t":"Presenting your own projects","tr":"interview","lv":"mid","one":"Deep-dive rounds ask you to walk through something you built. Show the problem, your decisions and trade-offs, what broke, and the measurable outcome.","rel":["behavioral","adr","levels","design-doc"],"qn":8},{"id":"take-home","t":"Take-home assignments & pairing rounds","tr":"interview","lv":"mid","one":"Some companies give a small project or a live pairing session. They grade judgement: scope, structure, tests, communication, and a clear README.","rel":["testing-pyramid","adr","behavioral"],"qn":8}];

</script>
<script>
/* Lesson kit: the runner and the shared pictures for Algorithms lessons.
   A lesson file (data/lessons/<patternId>.js, loaded on demand) calls LessonKit.define(id, { title, teaches, screens, walk });
   teaches = the sub-topic ids it teaches, in teaching order (the build marks them on the topic page).
   A screen is (ctx) => cleanup?; ctx = { el, done(), kit, topic }; topic = { subs, problems, teaches, next } from the runner
   (next = { id, t, sub, taught } the problem finishing opens, taught = it sits in a taught group; null = the whole topic is solved;
   art = data/lesson-art/<id>.webp exists: the runner shows it above the first screen only). It draws into ctx.el and calls ctx.done()
   once the learner has done its task. Continue stays disabled until then. Helpers return HTML strings. */
window.LessonKit = (() => {
  const L = {};
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const attrs = o => Object.entries(o).filter(([, v]) => v != null && v !== false).map(([k, v]) => v === true ? ` ${k}` : ` ${k}="${esc(v)}"`).join("");
  // frame over items [l, l+n) of a row of N with gap g: exact because the row has g/2 side padding
  const frame = (N, l, n, cls) => `<div class="frame${cls ? " " + cls : ""}" style="left:calc(${l / N * 100}% + 1px);width:calc(${n / N * 100}% - 2px)"></div>`;
  const under = (N, labels) => labels ? `<div class="under">${Array.from({ length: N }, (_, i) => `<span>${labels[i] == null ? "" : esc(labels[i])}</span>`).join("")}</div>` : "";
  const marks = (N, ptrs) => Object.keys(ptrs).length ? `<div class="under ptrs">${Array.from({ length: N }, (_, i) => `<span>${ptrs[i] ? esc(ptrs[i]) : ""}</span>`).join("")}</div>` : "";

  /* Bar chart. cls: {i: "in"|"enter"|"leave"|...}; frames: [[l, n, ghost?]]; pick: true or i => bool (bars become buttons with data-i); labels: text under each bar; ptrs: {i: "l"} as in cells. */
  function bars(values, { cls = {}, frames = [], pick = false, labels = null, ptrs = {} } = {}) {
    const N = values.length, mx = Math.max(...values.map(Math.abs), 1);
    const col = (v, i) => {
      const p = typeof pick === "function" ? pick(i) : pick, tag = p ? "button" : "div";
      return `<${tag}${attrs({ type: p ? "button" : null, class: `col ${cls[i] || ""}`, "data-i": i, "aria-label": p ? `${labels ? labels[i] + ": " : ""}${v}` : null })}><span class="v">${v}</span><span class="bar" style="height:${v / mx * 78}%"></span></${tag}>`;
    };
    return `<div class="chart${pick ? " pick" : ""}">${values.map(col).join("")}${frames.map(([l, n, g]) => frame(N, l, n, g ? "ghost" : "")).join("")}</div>${under(N, labels)}${marks(N, ptrs)}`;
  }
  /* A row of boxes (letters, numbers). cls: {i: class}; bracket: [l, r] inclusive; ptrs: {i: "left"}; labels: text under each box; pick as in bars. */
  function cells(values, { cls = {}, bracket = null, ptrs = {}, labels = null, pick = false } = {}) {
    const N = values.length;
    const br = bracket && bracket[1] >= bracket[0] ? frame(N, bracket[0], bracket[1] - bracket[0] + 1) : "";
    const box = (v, i) => { const t = (typeof pick === "function" ? pick(i) : pick) ? "button" : "div"; return `<${t}${t === "button" ? ' type="button"' : ""} class="cell ${cls[i] || ""}" data-i="${i}">${esc(v)}</${t}>`; };
    return `<div class="cells">${values.map(box).join("")}${br}</div>${under(N, labels)}${marks(N, ptrs)}`;
  }
  /* Two-column table that fills as the learner walks (a notebook, a map). rows: [[key, value]]; hit: row lit as found; fresh: row just written or changed. */
  const table = (rows, { head = ["key", "value"], title = "", hit = -1, fresh = -1, empty = "empty" } = {}) =>
    `<table class="ltable">${title ? `<caption>${esc(title)}</caption>` : ""}<thead><tr><th>${esc(head[0])}</th><th>${esc(head[1])}</th></tr></thead><tbody>${rows.length
      ? rows.map(([k, v], i) => `<tr${i === hit ? ' class="hit"' : i === fresh ? ' class="new"' : ""}><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")
      : `<tr class="none"><td colspan="2">${esc(empty)}</td></tr>`}</tbody></table>`;
  /* Feedback box. ok: true = right, false = names a mistake (.fb.no), omitted = neutral note. */
  const feedback = (html, ok) => `<div class="fb${ok === false ? " no" : ok === true ? "" : " note"}"${ok === false ? ' role="alert"' : ""}>${html}</div>`;
  /* Answer buttons (data-i). picked: index shown as chosen; correct: right index (gets data-right, the first other gets data-wrong). */
  function options(list, { picked = null, correct = null, num = false } = {}) {
    const wi = list.findIndex((_, i) => i !== correct);
    return `<div class="lopts">${list.map((t, i) => `<button${attrs({ type: "button", class: `${num ? "num " : ""}${picked === i ? (i === correct ? "right" : "wrong") : ""}`, "data-i": i, "data-right": i === correct, "data-wrong": correct != null && i === wi, "aria-pressed": picked === i ? "true" : null })}>${t}</button>`).join("")}</div>`;
  }
  /* Work meter: rows = [{ label, value, max, good? }]. */
  const meter = rows => `<div class="lmeter">${rows.map(r => `<span>${r.label}</span><span class="t"><u class="${r.good ? "g" : ""}" style="width:${r.max ? Math.min(100, r.value / r.max * 100) : 0}%"></u></span><b>${r.value.toLocaleString("en")}</b>`).join("")}</div>`;
  /* JavaScript listing with one highlighted line (or none: -1). */
  const code = (lines, active = -1) => `<pre class="lcode">${lines.map((c, j) => `<div${j === active ? ' class="on"' : ""}>${esc(c) || " "}</div>`).join("")}</pre>`;
  /* Last screen: lead naming topic.next (the problem the button opens), then the groups, taught ones first. notes: {subId: html}.
     The lead's wording lives here only: taught groups still open / all taught problems solved / whole topic solved. */
  function practice(T, notes = {}) {
    const tg = T.teaches || [], num = s => T.subs.indexOf(s) + 1, nx = T.next;
    const subs = [...tg.map(id => T.subs.find(s => s.id === id)).filter(Boolean), ...T.subs.filter(s => !tg.includes(s.id))];
    const grp = tg.length > 1 ? "groups" : "group";

  function qCard(c, qs, rec) {

    const qcode = Q.code ? `<figure class="code qcode"><figcaption><span>${esc(Q.code.title || "Read this")}</span><span class="lang">${esc(Q.code.lang || "")}</span></figcaption><pre><code>${esc(Q.code.src)}</code></pre></figure>` : "";

  function wireQ(c) {
    document.querySelectorAll("#qcard [data-opt]").forEach(b => b.addEventListener("click", () => {
      qState.picked = +b.dataset.opt;

      qState = newQ(c, (qState.qi + 1) % allQ(c).length);

  function refreshMarks() {

    document.querySelectorAll(".rail details").forEach((d, i) => { const list = C.filter(x => x.tr === TRACKS[i].id); d.querySelector(".c").textContent = counts(list).k + "/" + list.length; });
  }
  function wireLearn() {
    const c = byId[cur];
    document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => go(b.dataset.open)));
    document.querySelectorAll("[data-status]").forEach(b => b.addEventListener("click", () => { setStatus(c.id, b.dataset.status); refreshMarks(); }));
    wireQ(c);
    $("#askbox").replaceWith(askBox(c));
    const lb = $("#labdone"); if (lb) lb.addEventListener("change", () => setLab(c.id, lb.checked));
    document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab, b.closest(".panel-next") !== null)));
    const tl = $(".ctabs");
    if (tl) tl.addEventListener("keydown", e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      e.stopPropagation(); e.preventDefault();
      const ks = TABS.map(t => t[0]), i = (ks.indexOf(tab) + (e.key === "ArrowRight" ? 1 : -1) + ks.length) % ks.length;
      setTab(ks[i]); $("#tab-" + ks[i]).focus();

  /* explain-it-back with Claude */
  const drafts = {};
  let ctl = null;
  function askBox(c) {
    const wrap = document.createElement("div");
    wrap.id = "askbox";
    if (!c) return wrap;
    const available = !!sample;
    wrap.innerHTML = `
      <p class="hint" style="margin:0 0 10px">${available
        ? "Write how you would explain this to a junior teammate, without looking. Claude checks it against the notes and asks a harder follow-up. Or type a question instead."
        : "Write how you would explain this to a junior teammate, without looking. Then copy a ready-made grading prompt (it includes the reference notes) and paste it into Claude or any AI chat."}</p>
      <textarea id="explain" placeholder="In my own words, ${esc(c.t)} is…">${esc(drafts[c.id] || "")}</textarea>
      <div class="row">
        <button class="btn primary" id="grade">${available ? "Check my explanation" : "Copy grading prompt"}</button>
        <button class="btn" id="askq">${available ? "Ask this as a question" : "Copy as a question"}</button>
        <button class="btn" id="stop" hidden>Stop</button>
      </div>
      <div class="answer" id="out" hidden></div>`;
    const ta = wrap.querySelector("#explain"), out = wrap.querySelector("#out"), stop = wrap.querySelector("#stop");
    ta.addEventListener("input", () => { drafts[c.id] = ta.value; });
    stop.addEventListener("click", () => ctl && ctl.abort());
    const ref = `${c.t}: ${strip(c.one)}\nHow it works: ${strip(c.how.join(" "))}\nWhy it exists: ${strip(c.why)}\nTrade-offs: ${strip(c.trade)}\nCommon misconception: "${strip(c.myth.m)}" Reality: ${strip(c.myth.r)}`;
    async function run(kind) {
      const text = ta.value.trim();
      if (!text) { out.hidden = false; out.className = "answer dim"; out.textContent = kind === "grade" ? "Write your explanation first." : "Type your question first."; return; }
      const prompt = kind === "grade"
        ? `You are a senior full-stack engineer coaching a mid-level frontend developer who is working toward senior and tech lead level. They explained the concept "${c.t}" in their own words, from memory.\n\nReference notes (for you; they may be incomplete):\n${ref}\n\nTheir explanation:\n"""\n${text.slice(0, 4000)}\n"""\n\nReply in plain text with no markdown symbols, under 180 words, using exactly these four labelled lines or short paragraphs:\nVerdict: Solid, Partly there, or Off track, and one sentence why.\nRight: what they got right.\nMissing or wrong: the most important gaps or mistakes, concretely.\nNext question: one realistic scenario question that tests deeper understanding (do not answer it).`
        : `You are a senior full-stack engineer mentoring a mid-level frontend developer who is working toward senior level. They are studying "${c.t}".\n\nReference notes:\n${ref}\n\nTheir question:\n"""\n${text.slice(0, 4000)}\n"""\n\nAnswer clearly and concretely in plain text with no markdown symbols, under 230 words. Use a short real-world example where it helps. If the question rests on a misunderstanding, say so first.`;
      if (!sample) {
        out.hidden = false; out.className = "answer";
        let ok = false;
        try { await navigator.clipboard.writeText(prompt); ok = true; } catch (e) {}
        if (ok) {
          out.innerHTML = 'Prompt copied. Paste it into <a href="https://claude.ai/new" target="_blank" rel="noopener">Claude</a> (or any AI chat) to get feedback.';
        } else {
          out.innerHTML = '<span class="label" style="display:block;margin-bottom:6px">Copy this prompt</span><textarea readonly style="width:100%;min-height:160px;font-size:13px"></textarea>';

        }
        return;
      }
      ctl = new AbortController();
      out.hidden = false; out.className = "answer dim"; out.textContent = "Thinking…";
      stop.hidden = false;
      wrap.querySelectorAll("#grade,#askq").forEach(b => b.disabled = true);
      try {
        const r = await sample(prompt, { signal: ctl.signal, cache: false, onText: ({ text }) => { out.className = "answer"; out.textContent = text; } });
        out.className = "answer"; out.textContent = r.text + (r.truncated ? "\n\n(Answer was cut short.)" : "");
      } catch (e) {
        const code = e && e.code;
        if (code === "cancelled") { out.textContent = e.text || "Stopped."; }
        else {
          const msg = { not_granted: "Claude was not allowed for this page. Reload to be asked again.", sampling_disabled: "Claude is not available for this account.", rate_limited: "Too many requests right now. Try again in a minute.", session_expired: "Your Claude session expired. Sign in again and reload." }[code] || "Claude could not answer just now. Try again.";
          out.className = "answer dim"; out.textContent = (e && e.text ? e.text + "\n\n" : "") + msg;
          if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) sample = null;
        }
      } finally {
        stop.hidden = true;
        wrap.querySelectorAll("#grade,#askq").forEach(b => b.disabled = false);
      }
    }
    wrap.querySelector("#grade").addEventListener("click", () => run("grade"));
    wrap.querySelector("#askq").addEventListener("click", () => run("ask"));

  }

  /* drill */
  let D = null;
  /* capstone project: data/capstone.json, progress = acceptance checkboxes per milestone in S.cap */
  let CAP = null, capLoad = null, openMs = null;
  const ensureCapstone = () => capLoad || (capLoad = fetch("data/capstone.json?v=" + DATA_VERSION).then(r => { if (!r.ok) throw new Error(); return r.json(); }).then(d => (CAP = d)).catch(e => { capLoad = null; throw e; }));
  const msDone = ms => { const a = S.cap[ms.id] || []; return ms.acceptance.every((_, i) => a[i]); };
  const msCount = ms => (S.cap[ms.id] || []).filter(Boolean).length;
  function projectRender(m) {

    m.innerHTML = `<div class="project">
      <section class="band">

      <div class="meter"><div class="k" style="width:${(done / all.length) * 100}%"></div></div>
      </section>
      ${CAP.architecture ? `<section class="sec diagrams"><h2>Where you will end up</h2>${dg(CAP.architecture)}</section>` : ""}
      <section class="sec"><h2>Stack</h2><div class="tbl"><table class="stack"><thead><tr><th>Layer</th><th>Choice</th><th>Why</th></tr></thead><tbody>${CAP.stack.map(([a, b, c]) => `<tr><td>${a}</td><td><b>${b}</b></td><td>${c}</td></tr>`).join("")}</tbody></table></div></section>
      <section class="sec"><h2>Milestones</h2>${phases}</section>
      ${CAP.portfolio ? `<section class="sec duo3"><h2>Turn it into your interview story</h2><div class="pf">
        <div><h3>README</h3><ul class="ms-list">${CAP.portfolio.readme.map(x => `<li>${x}</li>`).join("")}</ul></div>
        <div><h3>What to talk about</h3><ul class="ms-list">${CAP.portfolio.story.map(x => `<li>${x}</li>`).join("")}</ul></div>
        <div><h3>3-minute demo</h3><ul class="ms-list">${CAP.portfolio.demo.map(x => `<li>${x}</li>`).join("")}</ul></div>
      </div></section>` : ""}
    </div>`;
    m.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => go(b.dataset.open)));
    m.querySelectorAll("details.ms").forEach(d => d.addEventListener("toggle", () => { if (d.open) openMs = d.dataset.ms; }));
    m.querySelectorAll("[data-acc]").forEach(cb => cb.addEventListener("change", () => {
      const id = cb.dataset.acc, arr = S.cap[id] ? [...S.cap[id]] : [];
      arr[+cb.dataset.i] = cb.checked; S.cap[id] = arr; persist();
      const ms = all.find(x => x.id === id), det = cb.closest("details");
      det.classList.toggle("ms-done", msDone(ms));
      det.querySelector(".ms-p").textContent = msDone(ms) ? "Done" : `${msCount(ms)}/${ms.acceptance.length}`;

  /* spaced repetition: each question has a box (0-5); a correct answer moves it up and pushes the next review out */
  const INTERVALS = [1, 3, 7, 14, 30, 60];
  const today = () => Math.floor(Date.now() / 86400000);
  const qkey = (id, qi) => id + "#" + qi;
  function dueCount() { const t = today(); return Object.values(S.srs).filter(r => r.due <= t).length; }
  function drillPool(scope) {
    const t = today();
    const inScope = c => scope === "due" || scope === "weak" || scope === "all" || c.tr === scope;
    const items = [];
    for (const c of C) if (inScope(c)) for (let qi = 0; qi < c.qn; qi++) items.push({ id: c.id, qi });
    const rnd = a => shuffle(a.length).map(i => a[i]);
    const due = items.filter(x => { const r = S.srs[qkey(x.id, x.qi)]; return r && r.due <= t; }).sort((a, b) => S.srs[qkey(a.id, a.qi)].due - S.srs[qkey(b.id, b.qi)].due);
    const unseen = items.filter(x => !S.srs[qkey(x.id, x.qi)]);
    const started = rnd(unseen.filter(x => st(x.id) !== "none"));
    const fresh = unseen.filter(x => st(x.id) === "none").sort((a, b) => orderIdx[a.id] - orderIdx[b.id] || a.qi - b.qi);
    let pool;
    if (scope === "due") pool = [...due, ...started, ...fresh];
    else if (scope === "weak") pool = [...due, ...rnd(items.filter(x => { const r = S.srs[qkey(x.id, x.qi)]; return r && r.box <= 1; })), ...rnd(unseen)];
    else pool = [...due, ...rnd(unseen), ...rnd(items)];
    const seen = new Set(), out = [], perConcept = {};
    for (const x of pool) {
      const k = qkey(x.id, x.qi);
      if (seen.has(k) || (perConcept[x.id] || 0) >= 2) continue;
      seen.add(k); perConcept[x.id] = (perConcept[x.id] || 0) + 1; out.push(x);
      if (out.length === 10) break;
    }
    return out;
  }
  let lastScope = "due";
  function drillView() {
    const nDue = dueCount();
    const opts = `<option value="due" ${lastScope === "due" ? "selected" : ""}>Due for review, then new (${nDue} due)</option><option value="weak" ${lastScope === "weak" ? "selected" : ""}>Questions I got wrong</option><option value="all" ${lastScope === "all" ? "selected" : ""}>Anything, shuffled</option>` + TRACKS.map(t => `<option value="${t.id}" ${lastScope === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("");
    let body = "";
    if (D && D.items.length && D.i < D.items.length) {
      const it = D.items[D.i], c = byId[it.id];
      const pips = D.items.map((x, k) => `<i class="${k < D.res.length ? (D.res[k] ? "r" : "w") : k === D.i ? "c" : ""}"></i>`).join("");
      const r = S.srs[qkey(it.id, it.qi)];
      const tag = !r ? "New question" : r.due <= today() ? "Review" : "Practice";
      body = `<div class="progress-line"><span class="label">Question ${D.i + 1} of ${D.items.length} · ${esc(trackById[c.tr].name)} · ${tag}</span><div class="pips">${pips}</div></div>
        ${qCard(c, D.q, null)}
        ${D.q.picked !== null ? `<p class="qmeta">${D.res[D.i] ? `Next review in ${INTERVALS[Math.min(S.srs[qkey(it.id, it.qi)].box - 1, 5)]} day(s).` : "This one comes back tomorrow."}</p>` : ""}
        <div class="row" style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          ${D.q.picked !== null ? `<button class="btn primary" id="dnext">${D.i + 1 < D.items.length ? "Next question" : "See results"}</button>` : ""}
          <button class="btn" data-open="${c.id}">Open “${esc(c.t)}”</button>
        </div>`;
    } else if (D && !D.items.length) {

      body = `<div class="summary"><div class="label">Round finished</div><div class="big">${right} / ${D.items.length}</div>
        ${missed.length ? `<div class="missed"><div class="label" style="margin-bottom:8px">Reread these</div><div class="chips">${missed.map(id => `<button class="chip" data-open="${id}">${dot(id)}${esc(byId[id].t)}</button>`).join("")}</div></div>` : `<p>Clean round. Wrong answers return tomorrow; right ones return later and later.</p>`}
        <div style="margin-top:18px"><button class="btn primary" id="dstart2">Another round</button></div></div>`;
    }

      <section class="band">

      <p>Ten questions of the kind that come up in senior interviews and real incidents. Each question comes back on a schedule: tomorrow if you got it wrong, then after 3, 7, 14, 30 and 60 days as you keep getting it right. Options are shuffled every time.</p>
      <div class="setup"><label><span class="label">What to drill</span><select id="scope">${opts}</select></label><button class="btn ${D ? "" : "primary"}" id="dstart">${D ? "Restart" : "Start 10 questions"}</button></div>
      </section>
      <div class="drill-body">${body}</div>
    </div>`;
  }
  async function startDrill() {
    lastScope = $("#scope").value;

    catch (e) { if (btn) { btn.disabled = false; btn.textContent = "Could not load — try again"; } return; }

  }
  function wireDrill() {
    $("#dstart").addEventListener("click", startDrill);
    const s2 = $("#dstart2"); if (s2) s2.addEventListener("click", startDrill);

    }
  }

  /* sidebar: overall progress, nav badges, numbered topic tree */
  const tree = $("#tree");
  let treeOpen = null;
  function renderSide() {
    const all = counts(C);
    $("#sideProg").innerHTML = `<div class="row"><span>Can explain</span><span><b>${all.k}</b> / ${all.n}</span></div>${meter(all)}`;
    const activeTr = view === "learn" && cur ? byId[cur].tr : null;

      const list = C.filter(x => x.tr === tid), ct = counts(list);
      return `<details class="tr" data-tr="${tid}" ${treeOpen === tid ? "open" : ""}><summary><span>${esc(trackById[tid].name)}</span><span class="tr-c">${ct.k}/${ct.n}</span></summary><ol>${list.map(x => `<li><a href="#${x.id}" ${view === "learn" && x.id === cur ? 'aria-current="page"' : ""}><span class="tp-n">${topicNum[x.id]}</span><span>${esc(x.t)}</span>${dot(x.id)}</a></li>`).join("")}</ol></details>`;
    }).join("")).join("");
    tree.querySelectorAll("details.tr").forEach(d => d.addEventListener("toggle", () => { if (d.open) treeOpen = d.dataset.tr; }));
    const a = tree.querySelector('[aria-current="page"]'); if (a && document.body.classList.contains("with-side")) a.scrollIntoView({ block: "nearest" });
  }
  /* "On this page" outline for the visible tab, with scrollspy */
  let tocObs = null;
  function buildToc() {
    const toc = $("#toc"); if (!toc) return;
    if (tocObs) { tocObs.disconnect(); tocObs = null; }
    const panel = document.querySelector(".panel:not([hidden])"); if (!panel) { toc.innerHTML = ""; return; }
    const heads = [...panel.querySelectorAll(".sec > h2, .duo h3")];
    heads.forEach((h, i) => { h.id = h.id || "s-" + i + "-" + h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 30); });
    toc.innerHTML = `<span class="label">On this page</span><ol>${heads.map(h => `<li><a href="#" data-to="${h.id}">${esc(h.textContent)}</a></li>`).join("")}</ol>`;
    toc.querySelectorAll("[data-to]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); const el = document.getElementById(a.dataset.to); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 120, behavior: "smooth" }); }));
    if ("IntersectionObserver" in window) {
      tocObs = new IntersectionObserver(es => {
        const vis = es.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
        if (vis) toc.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.to === vis.target.id));
      }, { rootMargin: "-110px 0px -65% 0px" });
      heads.forEach(h => tocObs.observe(h));
    }
  }
  /* mobile drawer */
  const side = $("#side"), scrim = $("#scrim"), menuBtn = $("#menuBtn");
  function drawer(open) { side.classList.toggle("open", open); scrim.hidden = !open; menuBtn.setAttribute("aria-expanded", String(open)); if (open) { const a = tree.querySelector('[aria-current="page"]'); if (a) a.scrollIntoView({ block: "center" }); } }
  menuBtn.addEventListener("click", () => drawer(!side.classList.contains("open")));
  scrim.addEventListener("click", () => drawer(false));
  window.addEventListener("hashchange", () => { drawer(false); if (!pal.hidden) closePalette(); });
  side.addEventListener("click", e => { if (e.target.closest(".tr li a")) drawer(false); });

  /* command palette (⌘K or /) */
  const pal = $("#palette"), q = $("#q"), res = $("#results");
  let hits = [], hi = 0;
  const norm = s => strip(s).toLowerCase();
  const INDEX = C.map(c => ({ c, t: c.t.toLowerCase(), body: norm(c.one), tr: trackById[c.tr].name.toLowerCase() }));
  const ACTIONS = [
    { k: "act", label: "Review due questions", sub: "Spaced repetition", run: () => go("drill") },
    { k: "act", label: "Open the capstone project", sub: "Slotly milestones", run: () => go("project") },
    { k: "act", label: "Open Today", sub: "Your route and what is next", run: () => go("today") },
    { k: "act", label: "All concepts", sub: "Phases and tracks", run: () => go("map") },
    { k: "act", label: "Algorithms", sub: "18 topics, problems grouped by technique", run: () => go("algo") },
    { k: "act", label: "All algorithm problems", sub: "Search and filter by company", run: () => go("algo/all") },
    { k: "act", label: "AI engineering", sub: "7 stages, from Python to shipping LLM products", run: () => go("ai") },
    { k: "act", label: "System design", sub: "45-minute mock interviews", run: () => go("design") },
    { k: "act", label: "Continue where I left off", sub: "Next topic not yet explained", run: () => go(nextUp().id) }
  ];
  function openPalette() { pal.hidden = false; q.value = ""; search(); q.focus(); }
  function closePalette() { pal.hidden = true; }
  function search() {
    const s = q.value.trim().toLowerCase();
    let topics = [];
    if (!s) topics = ORDER.filter(c => st(c.id) === "learning").slice(0, 5).concat(nextUp() ? [nextUp()] : []).filter((c, i, a) => a.indexOf(c) === i).slice(0, 6);
    else {
      const terms = s.split(/\s+/);
      topics = INDEX.map(x => {
        let sc = 0;
        for (const t of terms) {
          if (x.t.includes(t)) sc += x.t.startsWith(t) ? 10 : 6;
          else if (x.c.id.includes(t)) sc += 5;
          else if (x.tr.includes(t)) sc += 3;
          else if (x.body.includes(t)) sc += 1;
          else return null;
        }
        return { c: x.c, sc };
      }).filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, 9).map(h => h.c);
    }
    const acts = ACTIONS.filter(a => !s || a.label.toLowerCase().includes(s) || a.sub.toLowerCase().includes(s));
    const probs = s ? A.problems().map(p => { const t = (p.t + " " + p.lt).toLowerCase(), hay = t + " " + A.patName(p.p).toLowerCase() + " " + p.tags.join(" "); let sc = 0; for (const w of s.split(/\s+/)) { if (t.includes(w)) sc += 6; else if (hay.includes(w)) sc += 2; else return null; } return { p, sc }; }).filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, 6).map(h => h.p) : [];
    const dps = s ? D2.problems().filter(p => s.split(/\s+/).every(w => (p.t + " " + p.prompt + " " + p.tags.join(" ")).toLowerCase().includes(w))).slice(0, 4) : [];
    hits = [...topics.map(c => ({ kind: "topic", c })), ...probs.map(p => ({ kind: "prob", p })), ...dps.map(p => ({ kind: "dp", p })), ...acts.map(a => ({ kind: "act", a }))];
    hi = 0;
    let html = "";
    if (topics.length) html += `<div class="grp">${s ? "Topics" : "Continue"}</div>` + topics.map((c, i) => `<button role="option" data-i="${i}"><span class="k">${topicNum[c.id]}</span><b>${esc(c.t)}</b><span class="tag">${esc(trackById[c.tr].name)}</span><span class="s">${esc(strip(c.one))}</span></button>`).join("");
    if (probs.length) html += `<div class="grp">Algorithm problems</div>` + probs.map((p, j) => `<button role="option" data-i="${topics.length + j}"><span class="k df-${p.d}">${p.d[0].toUpperCase()}</span><b>${esc(p.t)}</b><span class="tag">${esc(A.patName(p.p))}</span><span class="s">${esc(p.lt)}</span></button>`).join("");
    if (dps.length) html += `<div class="grp">System design</div>` + dps.map((p, j) => `<button role="option" data-i="${topics.length + probs.length + j}"><span class="k">SD</span><b>${esc(p.t)}</b><span class="tag"></span><span class="s">${esc(p.prompt)}</span></button>`).join("");
    if (acts.length) html += `<div class="grp">Actions</div>` + acts.map((a, j) => `<button role="option" data-i="${topics.length + probs.length + dps.length + j}"><span class="k">→</span><b>${esc(a.label)}</b><span class="tag"></span><span class="s">${esc(a.sub)}</span></button>`).join("");
    res.innerHTML = html || `<div class="pal-empty">No topic matches “${esc(q.value)}”. Try a shorter word, like “cache” or “auth”.</div>`;
    res.querySelectorAll("[data-i]").forEach(b => { b.addEventListener("click", () => pick(+b.dataset.i)); b.addEventListener("mousemove", () => mark(+b.dataset.i)); });
    mark(0);
  }
  function mark(i) { hi = i; res.querySelectorAll("[data-i]").forEach(b => { const on = +b.dataset.i === hi; b.classList.toggle("on", on); if (on) b.scrollIntoView({ block: "nearest" }); }); }
  function pick(i) { const h = hits[i]; if (!h) return; closePalette(); if (h.kind === "topic") go(h.c.id); else if (h.kind === "prob") go("algo/" + h.p.id); else if (h.kind === "dp") go("design/" + h.p.id); else h.a.run(); }
  q.addEventListener("input", search);
  q.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); pick(hi); }
    else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (hits.length) mark((hi + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length); }
  });
  pal.addEventListener("click", e => { if (e.target === pal) closePalette(); });
  $("#cmdkBtn").addEventListener("click", openPalette);
  document.addEventListener("keydown", e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName);
    if ((e.key === "k" || e.key === "K") && (e.metaKey || e.ctrlKey)) { e.preventDefault(); pal.hidden ? openPalette() : closePalette(); return; }
    if (e.key === "/" && !typing && pal.hidden) { e.preventDefault(); openPalette(); return; }
    if (e.key === "Escape" && side.classList.contains("open")) drawer(false);
    if (view === "learn" && !typing && pal.hidden && (e.key === "ArrowRight" || e.key === "ArrowLeft") && !e.metaKey && !e.altKey) {
      const i = orderIdx[cur] + (e.key === "ArrowRight" ? 1 : -1);
      if (ORDER[i]) go(ORDER[i].id);
    }
  });
  if (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) === false) { const kb = document.querySelector(".cmdk kbd"); if (kb) kb.textContent = "Ctrl K"; }
  ensureCapstone().then(() => renderSide()).catch(() => {});

  const A = AlgoUI({ $, esc, S, persist, go, today, isoDay, rerender: () => render(), current: () => view === "problem" ? "algo/" + pid : view === "dproblem" ? "design/" + did : view, refreshChrome: () => { renderNav(); renderStreak(); } });
  const AI = AiUI({ esc, S, persist, go, isoDay, rerender: () => render(), current: hashOf });
  const D2 = SystemDesignUI({ $, esc, S, persist, go, today, renderBoxes, conceptTitle: id => byId[id] && byId[id].t, sample: () => sample, rerender: () => render(), current: () => view === "dproblem" ? "design/" + did : view, refreshChrome: () => { renderNav(); renderStreak(); } });
  D2.ensureIndex().then(() => { if (view === "today") render(); }).catch(() => {});
  A.ensureIndex().then(() => { if (view === "today") render(); else renderNav(); }).catch(() => {});

  /* boot */
  const h = location.hash.slice(1);
  if (h === "ai" || h.startsWith("ai/")) { view = "ai"; aid = h.slice(3); } else if (h.startsWith("algo/")) { view = "problem"; pid = h.slice(5); } else if (h.startsWith("design/")) { view = "dproblem"; did = h.slice(7); } else if (byId[h]) { view = "learn"; cur = h; } else if (VIEWS.includes(h)) { view = h; if (h === "learn") cur = nextUp().id; }
  render();
})();

</script>
</body>
</html>
